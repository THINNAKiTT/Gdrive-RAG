services:
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped

  app:
    build: .
    image: gdrive-rag:latest
    command: uv run streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - chroma
    restart: unless-stopped

  sync_daemon:
    build: .
    image: gdrive-rag:latest
    command: uv run python -m src.sync_daemon
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - chroma
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache: